name: Build and Release Android APK & Web ZIP Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web App & Bundle ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Lint and Build Web Application
        run: npm run build

      - name: Create Web Distribution ZIP
        run: |
          mkdir -p release-artifacts
          zip -r release-artifacts/HybridPlayer-Web-Dist.zip dist/
          zip -r release-artifacts/HybridPlayer-Complete-Source.zip . -x "node_modules/*" ".git/*" "dist/*" ".gradle/*"

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HybridPlayer-Web-Release
          path: release-artifacts/

  build-android:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper Executable and JAR
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Fetching gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi
          chmod +x ./gradlew || true

      - name: Build Android Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon

      - name: Copy Built APK to Artifacts
        run: |
          mkdir -p apk-artifacts
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} apk-artifacts/ \; || true
          if [ ! "$(ls -A apk-artifacts)" ]; then
            echo "Packaging standalone bundle..."
            zip -r apk-artifacts/HybridPlayer-Android-Project.zip app/ settings.gradle.kts build.gradle.kts gradle.properties gradlew gradlew.bat gradle/
          fi

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HybridPlayer-Android-APKs
          path: apk-artifacts/
