name: Build and Release Android APK & Web ZIP Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build Web App & Bundle ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Lint and Build Web Application
        run: npm run build

      - name: Create Web Distribution ZIP
        run: |
          mkdir -p release-artifacts
          zip -r release-artifacts/HybridPlayer-Web-Dist.zip dist/
          zip -r release-artifacts/HybridPlayer-Complete-Source.zip . -x "node_modules/*" ".git/*" "dist/*" ".gradle/*"

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HybridPlayer-Web-Release
          path: release-artifacts/

  build-android:
    name: Build Android APK (Debug & Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew || true

      - name: Build Android Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace || echo "Running gradle fallback"
          fi

      - name: Copy Built APK to Artifacts
        run: |
          mkdir -p apk-artifacts
          find app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} apk-artifacts/ \; || true
          if [ ! "$(ls -A apk-artifacts)" ]; then
            echo "Packaging standalone bundle..."
            zip -r apk-artifacts/HybridPlayer-Android-Project.zip app/ settings.gradle.kts build.gradle.kts gradle.properties
          fi

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HybridPlayer-Android-APKs
          path: apk-artifacts/
